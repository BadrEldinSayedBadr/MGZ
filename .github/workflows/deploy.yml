name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Verify Shopify configuration
        env:
          VITE_SHOPIFY_STORE_DOMAIN: ${{ vars.VITE_SHOPIFY_STORE_DOMAIN }}
          VITE_SHOPIFY_STOREFRONT_ACCESS_TOKEN: ${{ secrets.VITE_SHOPIFY_STOREFRONT_ACCESS_TOKEN }}
        run: |
          missing=0
          if [ -z "$VITE_SHOPIFY_STORE_DOMAIN" ]; then
            echo "::error::Missing GitHub Actions repository variable: VITE_SHOPIFY_STORE_DOMAIN"
            missing=1
          fi
          if [ -z "$VITE_SHOPIFY_STOREFRONT_ACCESS_TOKEN" ]; then
            echo "::error::Missing GitHub Actions repository secret: VITE_SHOPIFY_STOREFRONT_ACCESS_TOKEN"
            missing=1
          fi
          if [ "$missing" -ne 0 ]; then
            exit 1
          fi
      - name: Build site
        run: npm run build
        env:
          GITHUB_PAGES: 'true'
          VITE_SHOPIFY_STORE_DOMAIN: ${{ vars.VITE_SHOPIFY_STORE_DOMAIN }}
          VITE_SHOPIFY_STOREFRONT_ACCESS_TOKEN: ${{ secrets.VITE_SHOPIFY_STOREFRONT_ACCESS_TOKEN }}
          VITE_SHOPIFY_API_VERSION: ${{ vars.VITE_SHOPIFY_API_VERSION }}
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
